services:
  app:
    build: .
    container_name: audiobook-request
    # Match LibraForge/host library owner (pihole=1000) so pipeline staging dirs are writable by M4B/Folder Forge.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Host docker group so Admin can start/stop/restart stack containers via the socket.
    # Set DOCKER_GID to `getent group docker | cut -d: -f3` (often 998 or 999 on Pi).
    group_add:
      - "${DOCKER_GID:-998}"
    ports:
      - "8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Host library mounts - override via .env (see .env.example)
      - ${AUDIOBOOK_HOST_DIR:-./media/audiobooks}:/audiobooks
      - ${EBOOK_HOST_DIR:-./media/ebooks}:/ebooks
      - ${OPENLIBRARY_HOST_DIR:-./media/openlibrary}:/openlibrary
      # Admin Health panel: Start / Stop / Restart for compose services
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      # Override via .env. Empty = no Mullvad proxy (ABB RSS/live Flare paths skip VPN).
      # With VPN: COMPOSE_PROFILES=vpn and ABB_PROXY_URL=http://gluetun:8888
      - ABB_PROXY_URL=${ABB_PROXY_URL:-}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - JACKETT_URL=http://audiobook-jackett:9117
      - PYTHONUNBUFFERED=1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - prowlarr
      - flaresolverr
    restart: unless-stopped

  # Mullvad WireGuard — HTTP proxy only. Optional: enable with COMPOSE_PROFILES=vpn
  # (or docker compose --profile vpn up -d) after WireGuard keys are in .env.
  # Jackett/Prowlarr/app stay on the LAN bridge; ABB FlareSolverr sessions attach to
  # this proxy so only ABB egress pays the VPN latency.
  gluetun:
    image: qmcgaw/gluetun:v3.39.1
    container_name: audiobook-gluetun
    profiles:
      - vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
      - path: ./data/mullvad.env
        required: false
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${MULLVAD_COUNTRY:-USA}
      - HTTPPROXY=on
      - UPDATER_PERIOD=24h
      - TZ=${TZ:-UTC}
    # Proxy stays on the compose network (gluetun:8888). Do not publish Jackett here.
    expose:
      - "8888"
    volumes:
      - ./data/gluetun:/gluetun
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: audiobook-prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ./prowlarr-config:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - flaresolverr
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: audiobook-flaresolverr
    shm_size: "256mb"
    # Pi guardrails: unbounded Chromium routinely pushes load >10 and fills swap.
    mem_limit: 768m
    cpus: "1.5"
    pids_limit: 200
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
      - BROWSER_TIMEOUT=300000
    ports:
      - "8191:8191"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  # Normal bridge network — Knaben/other indexers are NOT slowed by Mullvad.
  jackett:
    image: linuxserver/jackett:latest
    container_name: audiobook-jackett
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./jackett-config:/config
    ports:
      - "9117:9117"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Bundled media stack (ABS + Kavita + LibraForge) — same Docker network as app.
  # Enable with COMPOSE_PROFILES=bundled-media (default for fresh installers).
  # Existing Pi installs that already point ABS/Kavita/LF at external hosts should
  # leave this profile off so those URLs/keys stay env-driven.
  # Extra RAM: expect ~1–2 GB beyond the core indexer stack.
  # ---------------------------------------------------------------------------
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    profiles:
      - bundled-media
    ports:
      - "13378:80"
    volumes:
      - ./audiobookshelf-config:/config
      - ./audiobookshelf-metadata:/metadata
      - ${AUDIOBOOK_HOST_DIR:-./media/audiobooks}:/audiobooks
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    profiles:
      - bundled-media
    ports:
      - "5000:5000"
    volumes:
      - ./kavita-config:/config
      - ${EBOOK_HOST_DIR:-./media/ebooks}:/ebooks
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx Proxy Manager — optional reverse proxy for remote HTTPS.
  # Enable with COMPOSE_PROFILES=npm (default for fresh installers).
  # Skip if you already run NPM / Caddy / Traefik / nginx elsewhere (ports 80/443).
  # Container name is library-npm to avoid clashing with a host-level "npm" stack.
  # Admin UI: http://<host>:81  |  HTTP/HTTPS: 80/443
  # ---------------------------------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.12.6
    container_name: library-npm
    profiles:
      - npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      - TZ=${TZ:-UTC}
      - INITIAL_ADMIN_EMAIL=${NPM_ADMIN_EMAIL:-admin@example.com}
      - INITIAL_ADMIN_PASSWORD=${NPM_ADMIN_PASSWORD:-changeme}
      # Pi / many hosts lack IPv6 — avoids "Address family not supported" noise.
      - DISABLE_IPV6=${NPM_DISABLE_IPV6:-true}
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
      # Long timeouts for search streams / ABS scans (included in every proxy host).
      - ./nginx/npm-server_proxy.conf:/data/nginx/custom/server_proxy.conf:ro
    restart: unless-stopped

  # Companion app — installers clone https://github.com/coconautilus17/LibraForge
  # into ./libraforge (gitignored) before starting this profile.
  libraforge:
    build: ./libraforge
    container_name: libraforge
    profiles:
      - bundled-media
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "5056:5056"
    environment:
      - SCRIPTS_DIR=/app/scripts
      - REPORTS_DIR=/app/reports
      - AUDIOBOOKS_ROOT=/audiobooks
      - TZ=${TZ:-UTC}
    volumes:
      - ${AUDIOBOOK_HOST_DIR:-./media/audiobooks}:/audiobooks
      - ./libraforge-auth:/auth
      - ./libraforge-config:/app/config
      - ./libraforge-reports:/app/reports
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5056/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
